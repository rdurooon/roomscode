<!-- Modal "Diretório do Host": árvore de pastas/arquivos do workspace do Host.
     O conteúdo é montado por directory-tree.js (sempre com textContent, pois os
     nomes vêm do computador do Host). Só texto vem das traduções directory.*. -->
<div class="modal-overlay" id="directory-modal" style="display:none;">
    <div class="modal-card directory-card" role="dialog" aria-modal="true" aria-labelledby="directory-title">
        <div class="directory-header">
            <h2 id="directory-title">{{ t('directory.title') }}</h2>
            <!-- Copia um comando de CMD que recria a estrutura (pastas e arquivos vazios) sem sobrescrever nada. -->
            <button type="button" class="directory-terminal-btn" id="directory-terminal-btn" title="{{ t('directory.terminal_tooltip') }}" aria-label="{{ t('directory.terminal_tooltip') }}">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17 15H12M7 10L10 12.5L7 15M3 15.8002V8.2002C3 7.08009 3 6.51962 3.21799 6.0918C3.40973 5.71547 3.71547 5.40973 4.0918 5.21799C4.51962 5 5.08009 5 6.2002 5H17.8002C18.9203 5 19.4796 5 19.9074 5.21799C20.2837 5.40973 20.5905 5.71547 20.7822 6.0918C21 6.5192 21 7.07899 21 8.19691V15.8031C21 16.921 21 17.48 20.7822 17.9074C20.5905 18.2837 20.2837 18.5905 19.9074 18.7822C19.48 19 18.921 19 17.8031 19H6.19691C5.07899 19 4.5192 19 4.0918 18.7822C3.71547 18.5905 3.40973 18.2837 3.21799 17.9074C3 17.4796 3 16.9203 3 15.8002Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </button>
        </div>
        <p class="directory-hint">{{ t('directory.hint') }}</p>
        <div class="directory-body" id="directory-body"></div>
        <p class="directory-truncated" id="directory-truncated" hidden>{{ t('directory.truncated_note') }}</p>
        <div class="modal-actions directory-actions">
            <button type="button" class="btn-outline" id="directory-close-btn">{{ t('directory.close_button') }}</button>
        </div>
    </div>
</div>
